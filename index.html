<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        button, a, input, div {
            outline: none !important;
        }

        button:focus, button:active, button:focus-visible {
            outline: none !important;
            box-shadow: none;
        }

        body {
            background: linear-gradient(135deg, #020617 0%, #090d16 50%, #020408 100%);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.18);
            filter: blur(90px);
            border-radius: 50%;
            top: 10%;
            left: 20%;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 10%;
            right: 20%;
            z-index: 0;
            pointer-events: none;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .logo-circle-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4),
                        inset 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatLogo 4s ease-in-out infinite;
        }

        .logo-image-area {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #0f172a;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-section {
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .welcome-section p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .google-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        /* الشاشة الترحيبية المؤقتة (تظهر 3 ثوانٍ) */
        #splash-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .splash-content h2 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .splash-content p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* واجهة المتجر / صفحة المشتريات */
        #store-screen {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* هيدر المتجر والصورة الشخصية في الزاوية المحددة */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .store-logo-text {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }

        /* حاوية الصورة الشخصية والقائمة المنسدلة */
        .user-menu-container {
            position: relative;
        }

        .profile-img-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            cursor: pointer;
            object-fit: cover;
            transition: transform 0.2s;
            background: #0f172a;
        }

        .profile-img-btn:hover {
            transform: scale(1.05);
        }

        /* القائمة المنسدلة عند الضغط على الصورة */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            left: 0;
            width: 220px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            padding: 15px;
            text-align: center;
            z-index: 101;
        }

        .dropdown-menu.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .dropdown-user-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            word-break: break-all;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .dropdown-logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .dropdown-logout-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        /* محتوى صفحة المشتريات */
        .purchases-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 75px);
            text-align: center;
            padding: 20px;
        }

        .purchases-content h1 {
            font-size: 32px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }

        /* زر الواتساب العائم */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s ease;
        }

        .whatsapp-float:active {
            cursor: grabbing;
        }

        .whatsapp-float:hover {
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.7);
        }

        #error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            word-break: break-all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-container">
            <div class="logo-circle-wrapper">
                <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="King Store Logo" class="logo-image-area">
            </div>
            
            <div class="welcome-section">
                <h1>مرحباً بك مجدداً</h1>
                <p>سجل دخولك الآن واستمتع بتجربة تسوق ذكية وآمنة.</p>
            </div>

            <button id="google-login-btn" class="google-btn">
                <i class="fa-brands fa-google"></i>
                <span>Continue with Google</span>
            </button>
            
            <p id="error-msg"></p>
        </div>
    </div>

    <!-- 2. الشاشة الترحيبية المؤقتة (تظهر 3 ثوانٍ) -->
    <div id="splash-screen">
        <div class="splash-content">
            <h2>مرحباً بكم في متجر King Store</h2>
            <p>جاري تحضير بيئة التسوق الخاصة بك...</p>
        </div>
    </div>

    <!-- 3. واجهة المتجر الرئيسية (صفحة المشتريات) -->
    <div id="store-screen">
        <header>
            <div class="store-logo-text">King Store 👑</div>
            
            <!-- مكان الصورة الشخصية في الزاوية -->
            <div class="user-menu-container">
                <img id="user-profile-img" src="" alt="Profile" class="profile-img-btn" title="حسابي">
                
                <!-- قائمة منسدلة عند الضغط على الصورة -->
                <div id="user-dropdown" class="dropdown-menu">
                    <div id="dropdown-username" class="dropdown-user-name">اسم المستخدم</div>
                    <button id="logout-btn" class="dropdown-logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </header>

        <div class="purchases-content">
            <h1>المشتريات</h1>
        </div>
    </div>

    <!-- زر الواتساب العائم -->
    <div id="whatsapp-fab" class="whatsapp-float" title="تواصل معنا عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Service Worker registered successfully'))
                    .catch((err) => console.log('Service Worker registration failed', err));
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('login-screen');
        const splashScreen = document.getElementById('splash-screen');
        const storeScreen = document.getElementById('store-screen');
        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');
        
        const userProfileImg = document.getElementById('user-profile-img');
        const userDropdown = document.getElementById('user-dropdown');
        const dropdownUsername = document.getElementById('dropdown-username');
        const logoutBtn = document.getElementById('logout-btn');
        const whatsappFab = document.getElementById('whatsapp-fab');

        let isLoginProcessed = false;

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                
                // إظهار شاشة الترحيب لمدة 3 ثوانٍ فقط عند أول تسجيل دخول للجلسة
                if (!isLoginProcessed) {
                    splashScreen.style.display = 'flex';
                    setTimeout(() => {
                        splashScreen.style.display = 'none';
                        storeScreen.style.display = 'block';
                    }, 3000);
                    isLoginProcessed = true;
                } else {
                    splashScreen.style.display = 'none';
                    storeScreen.style.display = 'block';
                }

                // عرض بيانات المستخدم الحقيقية في الزاوية
                userProfileImg.src = user.photoURL || "file_000000006a0881f4ab25ca2d85fb53a0.png";
                dropdownUsername.textContent = user.displayName || "مستخدم متميز";
            } else {
                isLoginProcessed = false;
                splashScreen.style.display = 'none';
                storeScreen.style.display = 'none';
                loginScreen.style.display = 'flex';
                userDropdown.classList.remove('active');
            }
        });

        // النقر على زر جوجل
        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });

        // فتح وإغلاق القائمة المنسدلة عند الضغط على الصورة الشخصية
        userProfileImg.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
        });

        // إغلاق القائمة عند النقر في أي مكان خارجها
        window.addEventListener('click', () => {
            userDropdown.classList.remove('active');
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("خطأ أثناء تسجيل الخروج", error);
            }
        });

        // زر الواتساب السلس
        whatsappFab.addEventListener('click', () => {
            if (isDragging) return;
            const phoneNumber = "201225428692";
            const message = "مرحباً، أريد الاستفسار عن منتجات في متجر King Store.";
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        });

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        whatsappFab.addEventListener('pointerdown', (e) => {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = whatsappFab.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            whatsappFab.style.right = 'auto';
            whatsappFab.style.bottom = 'auto';
            whatsappFab.style.left = `${initialLeft}px`;
            whatsappFab.style.top = `${initialTop}px`;

            whatsappFab.setPointerCapture(e.pointerId);
        });

        whatsappFab.addEventListener('pointermove', (e) => {
            if (!startX || !startY) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                isDragging = true;
            }

            if (isDragging) {
                let newX = initialLeft + dx;
                let newY = initialTop + dy;

                const maxX = window.innerWidth - whatsappFab.offsetWidth;
                const maxY = window.innerHeight - whatsappFab.offsetHeight;

                newX = Math.max(0, Math.min(newX, maxX));
                newY = Math.max(0, Math.min(newY, maxY));

                whatsappFab.style.left = `${newX}px`;
                whatsappFab.style.top = `${newY}px`;
            }
        });

        whatsappFab.addEventListener('pointerup', () => {
            startX = null;
            startY = null;
        });
    </script>
</body>
</html>
