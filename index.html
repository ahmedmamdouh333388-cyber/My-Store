<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: linear-gradient(145deg, #121816, #0d1210);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .welcome-section {
            margin-bottom: 25px;
            text-align: center;
        }
        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a3e635;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .welcome-section h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .welcome-section p {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.4;
        }
        .google-btn {
            width: 100%;
            padding: 14px;
            background-color: #161f1c;
            color: #ffffff;
            border: 1px solid #22302b;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover {
            background-color: #22302b;
            border-color: #a3e635;
        }
        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }
        #error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="welcome-section">
            <div class="logo-area">
                <i class="fa-solid fa-crown"></i>
                <span>King Store</span>
            </div>
            <h1>Welcome back</h1>
            <p>Sign in quickly and securely with your Google account.</p>
        </div>

        <button id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>
        
        <p id="error-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');

        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#9ca3af";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                errorMsg.style.color = "#a3e635";
                errorMsg.textContent = `أهلاً بك يا ${user.displayName}، تم تسجيل الدخول بنجاح!`;
            } catch (error) {
                errorMsg.style.color = "#ef4444";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });
    </script>
</body>
</html>
