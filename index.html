<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #020617 0%, #090d16 50%, #020408 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transform: translateZ(0);
            backface-visibility: hidden;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.18);
            filter: blur(90px);
            border-radius: 50%;
            top: 10%;
            left: 20%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 10%;
            right: 20%;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            text-align: center;
        }

        /* تنسيق الإطار الدائري الفخم للصورة */
        .logo-circle-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4),
                        inset 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatLogo 4s ease-in-out infinite;
        }

        .logo-image-area {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #0f172a;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-section {
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .welcome-section p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
            outline: none !important;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            margin-bottom: 12px;
        }

        .google-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .google-btn:active {
            transform: scale(0.96) translate3d(0, 0, 0);
            background: rgba(15, 23, 42, 0.95);
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        /* زرار الدخول كزائر بنفس تصميم الستايل الفخم */
        .guest-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            outline: none !important;
        }

        .guest-btn:hover {
            background: rgba(30, 41, 59, 0.4);
            color: #ffffff;
            border-color: rgba(56, 189, 248, 0.4);
        }

        .guest-btn:active {
            transform: scale(0.96);
        }

        .guest-btn i {
            font-size: 16px;
            color: #38bdf8;
        }

        #error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- الصورة داخل الإطار الدائري المتناسق -->
        <div class="logo-circle-wrapper">
            <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="King Store Logo" class="logo-image-area">
        </div>
        
        <div class="welcome-section">
            <h1>مرحباً بك مجدداً</h1>
            <p>سجل دخولك الآن واستمتع بتجربة تسوق ذكية وآمنة.</p>
        </div>

        <button id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>

        <!-- زرار الدخول كزائر المضاف حديثاً -->
        <button id="guest-login-btn" class="guest-btn">
            <i class="fa-solid fa-user-secret"></i>
            <span>تصفح كزائر (مجهول)</span>
        </button>
        
        <p id="error-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const guestBtn = document.getElementById('guest-login-btn');
        const errorMsg = document.getElementById('error-msg');

        // تسجيل الدخول بجوجل
        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                errorMsg.style.color = "#38bdf8";
                errorMsg.textContent = `أهلاً بك يا ${user.displayName}، تم تسجيل الدخول بنجاح!`;
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });

        // تسجيل الدخول كزائر (Anonymous)
        guestBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري الدخول كزائر...";

            try {
                const result = await signInAnonymously(auth);
                const user = result.user;
                errorMsg.style.color = "#38bdf8";
                errorMsg.textContent = `تم الدخول كزائر بنجاح! (معرف الزائر: ${user.uid.substring(0, 6)}...)`;
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ في الدخول كزائر: " + error.code;
            }
        });
    </script>
</body>
</html>
