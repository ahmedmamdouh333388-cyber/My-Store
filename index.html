<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - المتجر الملكي</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo">👑 King Store</div>
        <div class="auth-section">
            <button id="google-login-btn" class="btn-3d">تسجيل الدخول بقوقل</button>
            <div id="user-info" style="display: none;">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-3d danger">خروج</button>
            </div>
        </div>
    </header>

    <!-- لوحة تحكم الأدمن لإضافة المنتجات -->
    <section id="admin-panel" class="admin-panel" style="display: none;">
        <h2>لوحة تحكم الأدمن 🛠️</h2>
        <form id="product-form">
            <input type="text" id="prod-name" placeholder="اسم المنتج" required>
            <input type="text" id="prod-desc" placeholder="وصف المنتج" required>
            <input type="text" id="prod-price" placeholder="السعر (مثال: $19.99)" required>
            <input type="text" id="prod-img" placeholder="رابط صورة المنتج" required>
            <input type="url" id="prod-stripe" placeholder="رابط الدفع من Stripe (https://buy.stripe.com/...)" required>
            <button type="submit" class="btn-3d success">إضافة المنتج للمتجر</button>
        </form>
    </section>

    <!-- قسم عرض المنتجات -->
    <main>
        <h2>قائمة المنتجات المتوفرة</h2>
        <div id="products-grid" class="products-grid">
            <!-- المنتجات ستظهر هنا برمجياً -->
        </div>
    </main>

    <!-- قسم الشات المباشر مع الدعم -->
    <section class="chat-section">
        <h3>الدعم الفني المباشر 💬</h3>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا...">
            <button id="send-chat-btn" class="btn-3d">إرسال</button>
        </div>
    </section>

    <!-- زر واتساب العائم -->
    <a href="https://wa.me/01225428692" class="whatsapp-float" target="_blank" title="تواصل عبر واتساب">
        💬
    </a>

    <script src="app.js"></script>
</body>
</html>
