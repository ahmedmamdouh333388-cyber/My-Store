<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        button, a, input, div {
            outline: none !important;
        }

        button:focus, button:active, button:focus-visible {
            outline: none !important;
            box-shadow: none;
        }

        body {
            background: linear-gradient(135deg, #020617 0%, #090d16 50%, #020408 100%);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.18);
            filter: blur(90px);
            border-radius: 50%;
            top: 10%;
            left: 20%;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 10%;
            right: 20%;
            z-index: 0;
            pointer-events: none;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .logo-circle-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4),
                        inset 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatLogo 4s ease-in-out infinite;
        }

        .logo-image-area {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #0f172a;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-section {
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .welcome-section p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .google-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        /* واجهة المتجر الرئيسية (تكون مخفية حتى يتم تسجيل الدخول) */
        #store-screen {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* الهيدر العلوي للمتجر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            object-fit: cover;
        }

        .user-info h3 {
            font-size: 14px;
            color: #ffffff;
        }

        .user-info span {
            font-size: 11px;
            color: #38bdf8;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        /* محتوى المتجر */
        .store-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* شريط البحث */
        .search-bar {
            position: relative;
            margin-bottom: 25px;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            color: #ffffff;
            font-size: 14px;
            backdrop-filter: blur(6px);
        }

        .search-bar input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        /* الأقسام (Categories) */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* شبكة المنتجات */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .product-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #0f172a;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .buy-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        /* زر الواتساب العائم */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s ease;
        }

        .whatsapp-float:active {
            cursor: grabbing;
        }

        .whatsapp-float:hover {
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.7);
        }

        #error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-container">
            <div class="logo-circle-wrapper">
                <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="King Store Logo" class="logo-image-area">
            </div>
            
            <div class="welcome-section">
                <h1>مرحباً بك مجدداً</h1>
                <p>سجل دخولك الآن واستمتع بتجربة تسوق ذكية وآمنة.</p>
            </div>

            <button id="google-login-btn" class="google-btn">
                <i class="fa-brands fa-google"></i>
                <span>Continue with Google</span>
            </button>
            
            <p id="error-msg"></p>
        </div>
    </div>

    <!-- 2. واجهة المتجر الرئيسية (تظهر بعد الدخول) -->
    <div id="store-screen">
        <header>
            <div class="user-profile">
                <img id="user-avatar" src="" alt="User Avatar">
                <div class="user-info">
                    <h3 id="user-name">اسم المستخدم</h3>
                    <span>عميل مميز 👑</span>
                </div>
            </div>
            <button id="logout-btn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </header>

        <div class="store-content">
            <!-- شريط البحث -->
            <div class="search-bar">
                <input type="text" placeholder="ابحث عما تريده في متجر الملوك...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <!-- أقسام المتجر -->
            <div class="categories">
                <button class="cat-btn active">الكل 🔥</button>
                <button class="cat-btn">حسابات ألعاب 🎮</button>
                <button class="cat-btn">شدات وعملات 💎</button>
                <button class="cat-btn">اشتراكات رقمية 🎬</button>
                <button class="cat-btn">خدمات خاصة ⚡</button>
            </div>

            <!-- قائمة المنتجات -->
            <div class="section-title">
                <i class="fa-solid fa-fire text-sky-400"></i> العروض المميزة
            </div>

            <div class="products-grid">
                <!-- منتج تجريبي 1 -->
                <div class="product-card">
                    <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="Product" class="product-img">
                    <div>
                        <div class="product-name">حساب ألعاب ملكي</div>
                        <div class="product-price">150.00 ج.م</div>
                    </div>
                    <button class="buy-btn" onclick="alert('تمت الإضافة للسلة بنجاح!')">شراء الآن</button>
                </div>

                <!-- منتج تجريبي 2 -->
                <div class="product-card">
                    <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="Product" class="product-img">
                    <div>
                        <div class="product-name">شحن شدات سريع</div>
                        <div class="product-price">250.00 ج.م</div>
                    </div>
                    <button class="buy-btn" onclick="alert('تمت الإضافة للسلة بنجاح!')">شراء الآن</button>
                </div>

                <!-- منتج تجريبي 3 -->
                <div class="product-card">
                    <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="Product" class="product-img">
                    <div>
                        <div class="product-name">اشتراك بريميوم</div>
                        <div class="product-price">99.00 ج.م</div>
                    </div>
                    <button class="buy-btn" onclick="alert('تمت الإضافة للسلة بنجاح!')">شراء الآن</button>
                </div>

                <!-- منتج تجريبي 4 -->
                <div class="product-card">
                    <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="Product" class="product-img">
                    <div>
                        <div class="product-name">خدمة رقمية خاصة</div>
                        <div class="product-price">300.00 ج.م</div>
                    </div>
                    <button class="buy-btn" onclick="alert('تمت الإضافة للسلة بنجاح!')">شراء الآن</button>
                </div>
            </div>
        </div>
    </div>

    <!-- زر الواتساب العائم -->
    <div id="whatsapp-fab" class="whatsapp-float" title="تواصل معنا عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Service Worker registered successfully'))
                    .catch((err) => console.log('Service Worker registration failed', err));
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('login-screen');
        const storeScreen = document.getElementById('store-screen');
        const googleBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('error-msg');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const whatsappFab = document.getElementById('whatsapp-fab');

        // مراقبة حالة المستخدم (إذا كان مسجل دخول أم لا)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // إذا كان مسجل دخول، أظهر واجهة المتجر وأخفِ شاشة الدخول
                loginScreen.style.display = 'none';
                storeScreen.style.display = 'block';
                userName.textContent = user.displayName || "مستخدم متميز";
                userAvatar.src = user.photoURL || "file_000000006a0881f4ab25ca2d85fb53a0.png";
            } else {
                // إذا لم يكن مسجل دخول، أظهر شاشة الدخول وأخفِ المتجر
                loginScreen.style.display = 'flex';
                storeScreen.style.display = 'none';
            }
        });

        // تسجيل الدخول بـ Google
        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("خطأ أثناء تسجيل الخروج", error);
            }
        });

        // زر الواتساب العائم
        whatsappFab.addEventListener('click', () => {
            if (isDragging) return;
            const phoneNumber = "201225428692";
            const message = "مرحباً، أريد الاستفسار عن منتجات في متجر King Store.";
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        });

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        whatsappFab.addEventListener('pointerdown', (e) => {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = whatsappFab.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            whatsappFab.style.right = 'auto';
            whatsappFab.style.bottom = 'auto';
            whatsappFab.style.left = `${initialLeft}px`;
            whatsappFab.style.top = `${initialTop}px`;

            whatsappFab.setPointerCapture(e.pointerId);
        });

        whatsappFab.addEventListener('pointer
