<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    
    <!-- ربط ملف الـ Manifest لتمكين التثبيت -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        button, a, input, div {
            outline: none !important;
        }

        button:focus, button:active, button:focus-visible {
            outline: none !important;
            box-shadow: none;
        }

        body {
            background: linear-gradient(135deg, #020617 0%, #090d16 50%, #020408 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transform: translateZ(0);
            backface-visibility: hidden;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.18);
            filter: blur(90px);
            border-radius: 50%;
            top: 10%;
            left: 20%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 10%;
            right: 20%;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            text-align: center;
        }

        .logo-circle-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #38bdf8, #1e40af);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4),
                        inset 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatLogo 4s ease-in-out infinite;
        }

        .logo-image-area {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #0f172a;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .welcome-section {
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .welcome-section p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            margin-bottom: 12px;
        }

        .google-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .google-btn:active {
            transform: scale(0.96) translate3d(0, 0, 0);
            background: rgba(15, 23, 42, 0.95);
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s ease;
        }

        .whatsapp-float:active {
            cursor: grabbing;
        }

        .whatsapp-float:hover {
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.7);
        }

        #error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-circle-wrapper">
            <img src="file_000000006a0881f4ab25ca2d85fb53a0.png" alt="King Store Logo" class="logo-image-area">
        </div>
        
        <div class="welcome-section">
            <h1>مرحباً بك مجدداً</h1>
            <p>سجل دخولك الآن واستمتع بتجربة تسوق ذكية وآمنة.</p>
        </div>

        <button id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>
        
        <p id="error-msg"></p>
    </div>

    <div id="whatsapp-fab" class="whatsapp-float" title="تواصل معنا عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // تسجيل الـ Service Worker لتفعيل التثبيت (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Service Worker registered successfully'))
                    .catch((err) => console.log('Service Worker registration failed', err));
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');
        const whatsappFab = document.getElementById('whatsapp-fab');

        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                errorMsg.style.color = "#38bdf8";
                errorMsg.textContent = `أهلاً بك يا ${user.displayName}، تم تسجيل الدخول بنجاح!`;
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });

        whatsappFab.addEventListener('click', () => {
            if (isDragging) return;
            const phoneNumber = "201225428692";
            const message = "مرحباً، أريد الاستفسار عن منتجات في متجر King Store.";
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        });

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        whatsappFab.addEventListener('pointerdown', (e) => {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = whatsappFab.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            whatsappFab.style.right = 'auto';
            whatsappFab.style.bottom = 'auto';
            whatsappFab.style.left = `${initialLeft}px`;
            whatsappFab.style.top = `${initialTop}px`;

            whatsappFab.setPointerCapture(e.pointerId);
        });

        whatsappFab.addEventListener('pointermove', (e) => {
            if (!startX || !startY) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                isDragging = true;
            }

            if (isDragging) {
                let newX = initialLeft + dx;
                let newY = initialTop + dy;

                const maxX = window.innerWidth - whatsappFab.offsetWidth;
                const maxY = window.innerHeight - whatsappFab.offsetHeight;

                newX = Math.max(0, Math.min(newX, maxX));
                newY = Math.max(0, Math.min(newY, maxY));

                whatsappFab.style.left = `${newX}px`;
                whatsappFab.style.top = `${newY}px`;
            }
        });

        whatsappFab.addEventListener('pointerup', () => {
            startX = null;
            startY = null;
        });
    </script>
</body>
</html>
