<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent; /* إلغاء التظليل الافتراضي في الموبايل */
        }

        body {
            background: radial-gradient(circle at center, #111b16 0%, #050807 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* كارت عادي ومستقر بدون 3D مائل */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            background: rgba(18, 26, 22, 0.95);
            border-radius: 24px;
            border: 1px solid rgba(163, 230, 53, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(163, 230, 53, 0.05);
        }

        .welcome-section {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a3e635;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .welcome-section h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .welcome-section p {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.5;
        }

        /* تصميم زرار احترافي بدون مربعات شفافة مزعجة وعند الضغط يتأثر بنعومة */
        .google-btn {
            width: 100%;
            padding: 15px;
            background-color: #16201b;
            color: #ffffff;
            border: 1px solid #283831;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            outline: none !important; /* إلغاء المربع الأزرق نهائياً */
        }

        .google-btn:hover {
            background-color: #1f2e27;
            border-color: #a3e635;
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.15);
        }

        /* تأثير ضغط ناعم وبدون مربعات */
        .google-btn:active {
            transform: scale(0.97);
            background-color: #121a16;
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        #error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="welcome-section">
            <div class="logo-area">
                <i class="fa-solid fa-crown"></i>
                <span>King Store</span>
            </div>
            <h1>مرحباً بك مجدداً</h1>
            <p>سجل دخولك الآن واستمتع بتجربة تسوق فريدة وآمنة.</p>
        </div>

        <button id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>
        
        <p id="error-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');

        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#9ca3af";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                errorMsg.style.color = "#a3e635";
                errorMsg.textContent = `أهلاً بك يا ${user.displayName}، تم تسجيل الدخول بنجاح!`;
            } catch (error) {
                errorMsg.style.color = "#ef4444";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });
    </script>
</body>
</html>
