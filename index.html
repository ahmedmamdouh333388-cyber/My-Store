<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Store - متجر الملوك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* خلفية تكنولوجية عميقة بألوان نيون وسيرفرات حديثة */
            background: linear-gradient(135deg, #020617 0%, #090d16 50%, #020408 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transform: translateZ(0);
            backface-visibility: hidden;
            position: relative;
            overflow: hidden;
        }

        /* إضافة تأثير إضاءة خلفية تكنولوجية (Glow effects) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(6, 182, 212, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            top: 15%;
            left: 25%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(59, 130, 246, 0.1);
            filter: blur(80px);
            border-radius: 50%;
            bottom: 15%;
            right: 25%;
            z-index: 0;
        }

        /* كارت الملمس الزجاجي (Glassmorphism) الفاخر */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
        }

        .welcome-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 19px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .welcome-section h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .welcome-section p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* زرار تكنولوجي بملمس ناعم واستجابة فورية */
        .google-btn {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
            outline: none !important;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .google-btn:hover {
            background: rgba(51, 65, 85, 0.85);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .google-btn:active {
            transform: scale(0.96) translate3d(0, 0, 0);
            background: rgba(15, 23, 42, 0.9);
        }

        .google-btn i {
            font-size: 18px;
            color: #ea4335;
        }

        #error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="welcome-section">
            <div class="logo-area">
                <i class="fa-solid fa-crown"></i>
                <span>King Store</span>
            </div>
            <h1>مرحباً بك مجدداً</h1>
            <p>سجل دخولك الآن واستمتع بتجربة تسوق ذكية وآمنة.</p>
        </div>

        <button id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>
        
        <p id="error-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
            authDomain: "my-store-75b70.firebaseapp.com",
            projectId: "my-store-75b70",
            storageBucket: "my-store-75b70.firebasestorage.app",
            messagingSenderId: "762773021655",
            appId: "1:762773021655:web:ce1490aab54115d549e192",
            measurementId: "G-CT3FQN4BBK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');

        googleBtn.addEventListener('click', async () => {
            errorMsg.style.color = "#94a3b8";
            errorMsg.textContent = "جاري فتح نافذة جوجل...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                errorMsg.style.color = "#38bdf8";
                errorMsg.textContent = `أهلاً بك يا ${user.displayName}، تم تسجيل الدخول بنجاح!`;
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "خطأ: " + error.code;
            }
        });
    </script>
</body>
</html>
